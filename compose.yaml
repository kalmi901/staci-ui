services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      STACI_UI_ENV: production
      PORT: "8050"
      DASH_DEBUG: "0"
    volumes:
      - staci-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  staci-data:
  caddy-data:
  caddy-config:
