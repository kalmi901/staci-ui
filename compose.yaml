services:
  app:
    build: .
    restart: unless-stopped
    environment:
      STACI_UI_URL_PREFIX: /staci-app/
      PORT: "8050"
      DASH_DEBUG: "0"
      STACI_TIMEOUT_SECONDS: ${STACI_TIMEOUT_SECONDS:-300}
    volumes:
      - staci-data:/data
    networks:
      - solver

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - wordpress-db:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${SITE_DOMAIN:-hydroreact.org}');
        define('WP_SITEURL', 'https://${SITE_DOMAIN:-hydroreact.org}');
        define('FORCE_SSL_ADMIN', true);
    volumes:
      - wordpress-data:/var/www/html
      - ./deploy/wordpress/staci-tool:/var/www/html/wp-content/plugins/staci-tool:ro
    networks:
      - default
      - database
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('/var/www/html/wp-config.php') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress-init:
    image: wordpress:cli-php8.3
    restart: "no"
    user: "33:33"
    environment:
      <<: *wordpress-environment
      SITE_DOMAIN: ${SITE_DOMAIN:-hydroreact.org}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:?Set WORDPRESS_ADMIN_USER in .env}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?Set WORDPRESS_ADMIN_PASSWORD in .env}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:?Set WORDPRESS_ADMIN_EMAIL in .env}
    volumes:
      - wordpress-data:/var/www/html
      - ./deploy/wordpress/initialize.sh:/usr/local/bin/staci-wordpress-init.sh:ro
    command: [sh, /usr/local/bin/staci-wordpress-init.sh]
    networks:
      - database
    depends_on:
      wordpress:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-hydroreact.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
      wordpress-init:
        condition: service_completed_successfully
    networks:
      - default
      - solver

networks:
  solver:
    internal: true
  database:
    internal: true

volumes:
  staci-data:
  caddy-data:
  caddy-config:
  wordpress-data:
  wordpress-db:
